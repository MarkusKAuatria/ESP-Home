<text x="760" y="354" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Q2, Q4, Q6 in Ruhe = N (Stern), angezogen = Phase (Dreieck).</text>
<text x="760" y="372" font-size="12" text-anchor="start" font-weight="normal" fill="#666">8 kW ist mit 3 Elementen nicht möglich.</text>
<polyline points="20,470 1180,470" fill="none" stroke="#bbb" stroke-width="1"/>
<text x="20" y="496" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Wichtig:</text>
<text x="20" y="516" font-size="13" text-anchor="start" font-weight="normal" fill="#000">• Q2, Q4, Q6 müssen echte Umschalter sein (Öffner + Schließer im selben Schütz, mechanisch gekoppelt).</text>
<text x="20" y="536" font-size="13" text-anchor="start" font-weight="normal" fill="#000">• Die Firmware schaltet Q2/Q4/Q6 nur stromlos: erst Q1, Q3, Q5 aus, 0,5 s Pause, umschalten, 0,5 s Pause, dann ein.</text>
<text x="20" y="556" font-size="13" text-anchor="start" font-weight="normal" fill="#000">• Die Heizpatrone braucht ihren eigenen Sicherheitstemperaturbegrenzer (STB) – die Software-Abschaltung ersetzt ihn nicht.</text>
<text x="20" y="576" font-size="13" text-anchor="start" font-weight="normal" fill="#000">• Absicherung, Fehlerstromschutz, Leitungsquerschnitte und Ausführung: nur durch eine Elektrofachkraft.</text>
</svg>
