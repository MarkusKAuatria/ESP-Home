# =============================================================================
# ESPHome: 3 Relais an einem Wemos D1 mini, gestuft nach einem Sollwert
#
#   Sollwert <  1000  -> alle Relais AUS
#   Sollwert >= 1000  -> Relais 1 EIN
#   Sollwert >= 2000  -> Relais 1 + 2 EIN
#   Sollwert >= 3000  -> Relais 1 + 2 + 3 EIN
#
# Der Sollwert ist in Home Assistant als Zahl-Entität "Sollwert" sichtbar und
# kann dort per Schieberegler oder per Automation gesetzt werden. Optional kann
# der Wert auch direkt von einem Home-Assistant-Sensor kommen (siehe unten).
# =============================================================================

substitutions:
  name: d1-mini-relais
  friendly_name: "D1 mini Relais"

  # Schaltschwellen
  schwelle_1: "1000"
  schwelle_2: "2000"
  schwelle_3: "3000"
  einheit: "W"

  # GPIOs der Relais (D1 = GPIO5, D2 = GPIO4, D5 = GPIO14).
  # Diese Pins sind beim Booten unkritisch – D3, D4 und D8 bitte meiden.
  relais_1_pin: D1
  relais_2_pin: D2
  relais_3_pin: D5

  # Die meisten günstigen Relais-Module schalten bei LOW ("active low").
  # Schaltet dein Relais genau verkehrt herum, hier "false" eintragen.
  relais_invertiert: "true"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      # Nach dem Start den aktuellen Sollwert anwenden (Standard: 0 = alles aus)
      - script.execute:
          id: relais_setzen
          wert: !lambda "return id(sollwert).state;"

esp8266:
  board: d1_mini

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback-Hotspot, falls das WLAN nicht erreichbar ist
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_ap_password

captive_portal:

# -----------------------------------------------------------------------------
# Relais
# -----------------------------------------------------------------------------
switch:
  - platform: gpio
    id: relais_1
    name: "Relais 1"
    pin:
      number: ${relais_1_pin}
      inverted: ${relais_invertiert}
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: relais_2
    name: "Relais 2"
    pin:
      number: ${relais_2_pin}
      inverted: ${relais_invertiert}
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: relais_3
    name: "Relais 3"
    pin:
      number: ${relais_3_pin}
      inverted: ${relais_invertiert}
    restore_mode: ALWAYS_OFF

# -----------------------------------------------------------------------------
# Sollwert (in Home Assistant einstellbar)
# -----------------------------------------------------------------------------
number:
  - platform: template
    id: sollwert
    name: "Sollwert"
    icon: mdi:gauge
    unit_of_measurement: ${einheit}
    min_value: 0
    max_value: ${schwelle_3}
    step: 100
    mode: slider
    optimistic: true
    # Aus Sicherheitsgründen startet das Gerät immer mit 0 (alle Relais aus).
    # Soll der letzte Wert nach einem Neustart wiederhergestellt werden:
    # restore_value auf true setzen.
    initial_value: 0
    restore_value: false
    on_value:
      - script.execute:
          id: relais_setzen
          wert: !lambda "return x;"

# -----------------------------------------------------------------------------
# OPTIONAL: Wert direkt von einem Home-Assistant-Sensor übernehmen
# (z. B. PV-Überschuss). Dazu den Block einkommentieren und die entity_id
# anpassen. Werte über 3000 schalten ebenfalls alle 3 Relais ein.
# -----------------------------------------------------------------------------
# sensor:
#   - platform: homeassistant
#     id: ha_wert
#     entity_id: sensor.pv_ueberschuss
#     on_value:
#       - script.execute:
#           id: relais_setzen
#           wert: !lambda "return x;"

# -----------------------------------------------------------------------------
# Schaltlogik
# -----------------------------------------------------------------------------
script:
  - id: relais_setzen
    mode: restart
    parameters:
      wert: float
    then:
      - lambda: |-
          if (isnan(wert)) {
            wert = 0;
          }
          ESP_LOGI("relais", "Sollwert %.0f ${einheit}", wert);

          // Beim Abschalten von oben nach unten, beim Zuschalten von unten
          // nach oben, damit nie eine "Lücke" (z. B. nur Relais 3) entsteht.
          if (wert < ${schwelle_3}) id(relais_3).turn_off();
          if (wert < ${schwelle_2}) id(relais_2).turn_off();
          if (wert < ${schwelle_1}) id(relais_1).turn_off();

          if (wert >= ${schwelle_1}) id(relais_1).turn_on();
          if (wert >= ${schwelle_2}) id(relais_2).turn_on();
          if (wert >= ${schwelle_3}) id(relais_3).turn_on();
