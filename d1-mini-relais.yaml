# =============================================================================
# ESPHome: 3 Relais an einem Wemos D1 mini, gestuft nach PV-Überschuss
#
#   Verfügbare Leistung >= 1000  -> Relais 1 EIN
#   Verfügbare Leistung >= 2000  -> Relais 1 + 2 EIN
#   Verfügbare Leistung >= 3000  -> Relais 1 + 2 + 3 EIN
#
# Gegen ständiges Ein-/Ausschalten (Flattern) sorgen:
#   - Kompensation: Die Leistung bereits eingeschalteter Relais wird zum
#     gemessenen Überschuss addiert ("verfügbare Leistung"). Sonst würde das
#     Einschalten den Überschuss sofort wieder unter die Schwelle drücken.
#   - Hysterese: Eine Stufe schaltet erst ab, wenn die verfügbare Leistung um
#     die Hysterese UNTER ihre Einschaltschwelle fällt (Standard 1000 -> 800).
#   - Verzögerungen: Die Bedingung muss eine Zeit lang durchgehend erfüllt sein
#     (Standard: 60 s zum Zuschalten, 30 s zum Abschalten).
#
# Hysterese und Verzögerungen sind in Home Assistant einstellbar.
# =============================================================================

substitutions:
  name: d1-mini-relais
  friendly_name: "D1 mini Relais"

  # Home-Assistant-Sensor mit dem PV-Überschuss in Watt.
  # Positiv = Einspeisung ins Netz (siehe Hinweis beim Sensor weiter unten).
  pv_sensor: sensor.pv_ueberschuss

  # Leistung, die ein eingeschaltetes Relais verbraucht (z. B. eine Phase
  # eines 3-kW-Heizstabs = 1000 W). Wird zum gemessenen Überschuss addiert.
  # Auf "0" setzen, wenn dein Sensor den Verbrauch der Relais NICHT enthält.
  leistung_relais: "1000"

  # Einschaltschwellen der Stufen (verfügbare Leistung in W)
  schwelle_1: "1000"
  schwelle_2: "2000"
  schwelle_3: "3000"

  # Startwerte der in Home Assistant einstellbaren Parameter
  hysterese: "200"
  einschaltverzoegerung: "60"
  ausschaltverzoegerung: "30"

  # GPIOs der Relais (D1 = GPIO5, D2 = GPIO4, D5 = GPIO14).
  # Diese Pins sind beim Booten unkritisch – D3, D4 und D8 bitte meiden.
  relais_1_pin: D1
  relais_2_pin: D2
  relais_3_pin: D5

  # Die meisten günstigen Relais-Module schalten bei LOW ("active low").
  # Schaltet dein Relais genau verkehrt herum, hier "false" eintragen.
  relais_invertiert: "true"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: d1_mini
  # Einstellungen (Hysterese, Verzögerungen, Automatik) auch nach
  # Stromausfall behalten
  restore_from_flash: true

logger:

api:
  id: api_server
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback-Hotspot, falls das WLAN nicht erreichbar ist
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_ap_password

captive_portal:

# -----------------------------------------------------------------------------
# Interne Zustände der Regelung
# -----------------------------------------------------------------------------
globals:
  # Aktuelle Stufe 0..3 (= Anzahl eingeschalteter Relais)
  - id: stufe
    type: int
    initial_value: "0"
  # Gewünschte Änderung: +1 = zuschalten, -1 = abschalten, 0 = keine
  - id: wunsch_richtung
    type: int
    initial_value: "0"
  # Seit wann (millis) die gewünschte Änderung ununterbrochen ansteht
  - id: wunsch_seit
    type: uint32_t
    initial_value: "0"
  # Gemessener Überschuss + Leistung der eingeschalteten Relais
  - id: verfuegbare_leistung
    type: float
    initial_value: "NAN"

# -----------------------------------------------------------------------------
# Eingang: PV-Überschuss aus Home Assistant
# -----------------------------------------------------------------------------
sensor:
  - platform: homeassistant
    id: pv_ueberschuss
    entity_id: ${pv_sensor}
    # Liefert dein Sensor Einspeisung als NEGATIVEN Wert (z. B. Netzbezug
    # positiv, Einspeisung negativ), die folgenden zwei Zeilen einkommentieren:
    # filters:
    #   - multiply: -1

  # Anzeige in Home Assistant
  - platform: template
    id: stufe_sensor
    name: "Stufe"
    icon: mdi:stairs
    accuracy_decimals: 0
    state_class: measurement
    update_interval: never

  - platform: template
    name: "Verfügbare Leistung"
    icon: mdi:solar-power
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    lambda: "return id(verfuegbare_leistung);"
    update_interval: 10s

# -----------------------------------------------------------------------------
# Relais + Automatik-Schalter
# -----------------------------------------------------------------------------
switch:
  - platform: gpio
    id: relais_1
    name: "Relais 1"
    pin:
      number: ${relais_1_pin}
      inverted: ${relais_invertiert}
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: relais_2
    name: "Relais 2"
    pin:
      number: ${relais_2_pin}
      inverted: ${relais_invertiert}
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: relais_3
    name: "Relais 3"
    pin:
      number: ${relais_3_pin}
      inverted: ${relais_invertiert}
    restore_mode: ALWAYS_OFF

  # EIN: Relais werden nach PV-Überschuss geregelt.
  # AUS: Alle Relais aus, danach von Hand schaltbar.
  - platform: template
    id: pv_automatik
    name: "PV-Automatik"
    icon: mdi:solar-power-variant
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - script.execute: regelung_zuruecksetzen
    turn_off_action:
      - script.execute: regelung_zuruecksetzen

# -----------------------------------------------------------------------------
# In Home Assistant einstellbare Parameter
# -----------------------------------------------------------------------------
number:
  - platform: template
    id: hysterese
    name: "Hysterese"
    icon: mdi:arrow-expand-vertical
    entity_category: config
    unit_of_measurement: W
    min_value: 0
    max_value: 1000
    step: 50
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${hysterese}

  - platform: template
    id: einschaltverzoegerung
    name: "Einschaltverzögerung"
    icon: mdi:timer-plus-outline
    entity_category: config
    unit_of_measurement: s
    # Mindestens 10 s, damit der Messwert nach dem Schalten nachziehen kann
    min_value: 10
    max_value: 900
    step: 5
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${einschaltverzoegerung}

  - platform: template
    id: ausschaltverzoegerung
    name: "Ausschaltverzögerung"
    icon: mdi:timer-minus-outline
    entity_category: config
    unit_of_measurement: s
    min_value: 10
    max_value: 900
    step: 5
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${ausschaltverzoegerung}

# -----------------------------------------------------------------------------
# Regelung
# -----------------------------------------------------------------------------
script:
  # Schaltet die Relais passend zur aktuellen Stufe
  - id: stufe_anwenden
    then:
      - lambda: |-
          const int s = id(stufe);
          // Abschalten von oben nach unten, Zuschalten von unten nach oben,
          // damit nie eine "Lücke" (z. B. nur Relais 3) entsteht.
          if (s < 3) id(relais_3).turn_off();
          if (s < 2) id(relais_2).turn_off();
          if (s < 1) id(relais_1).turn_off();
          if (s >= 1) id(relais_1).turn_on();
          if (s >= 2) id(relais_2).turn_on();
          if (s >= 3) id(relais_3).turn_on();
          id(stufe_sensor).publish_state(s);

  # Beim Ein- und Ausschalten der Automatik: alles aus, Zähler zurücksetzen
  - id: regelung_zuruecksetzen
    then:
      - lambda: |-
          id(stufe) = 0;
          id(wunsch_richtung) = 0;
          id(verfuegbare_leistung) = NAN;
      - script.execute: stufe_anwenden

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (!id(pv_automatik).state) {
            id(wunsch_richtung) = 0;
            id(verfuegbare_leistung) = NAN;
            return;
          }

          static const float SCHWELLE[4] = {0, ${schwelle_1}, ${schwelle_2}, ${schwelle_3}};
          const float hyst = id(hysterese).state;
          const int n = id(stufe);

          // Verfügbare Leistung = Messwert + Verbrauch der eingeschalteten Relais
          const float ueberschuss = id(pv_ueberschuss).state;
          const bool daten_ok = id(api_server).is_connected() && !std::isnan(ueberschuss);
          const int aktiv = id(relais_1).state + id(relais_2).state + id(relais_3).state;
          const float verfuegbar = daten_ok ? ueberschuss + aktiv * ${leistung_relais} : NAN;
          id(verfuegbare_leistung) = verfuegbar;

          // Zielstufe bestimmen
          int ziel = n;
          if (!daten_ok) {
            // Keine Verbindung zu Home Assistant / Sensor nicht verfügbar:
            // sicherheitshalber (nach der Ausschaltverzögerung) alles aus
            ziel = 0;
          } else {
            // Abschalten: jede Stufe, deren Schwelle minus Hysterese
            // unterschritten ist (auch mehrere Stufen auf einmal)
            while (ziel > 0 && verfuegbar < SCHWELLE[ziel] - hyst) ziel--;
            // Zuschalten: immer nur eine Stufe, dann neu messen
            if (ziel == n && n < 3 && verfuegbar >= SCHWELLE[n + 1]) ziel = n + 1;
          }

          const int richtung = (ziel > n) - (ziel < n);
          const uint32_t jetzt = millis();

          if (richtung == 0) {
            if (id(wunsch_richtung) != 0) {
              ESP_LOGD("pv", "Bedingung nicht mehr erfüllt, bleibe bei Stufe %d", n);
            }
            id(wunsch_richtung) = 0;
            return;
          }

          // Neue Wunschrichtung: Verzögerung starten
          if (richtung != id(wunsch_richtung)) {
            id(wunsch_richtung) = richtung;
            id(wunsch_seit) = jetzt;
            ESP_LOGD("pv", "%s angefordert (verfügbar %.0f W), warte ...",
                     richtung > 0 ? "Zuschalten" : "Abschalten", verfuegbar);
            return;
          }

          const float verz_s = richtung > 0 ? id(einschaltverzoegerung).state
                                            : id(ausschaltverzoegerung).state;
          if (jetzt - id(wunsch_seit) < (uint32_t) (verz_s * 1000.0f)) {
            return;
          }

          ESP_LOGI("pv", "Stufe %d -> %d (verfügbar %.0f W)", n, ziel, verfuegbar);
          id(stufe) = ziel;
          id(wunsch_richtung) = 0;
          id(stufe_anwenden).execute();
