# =============================================================================
# ESPHome: Ansteuerung einer Heizpatrone im Pufferspeicher
#          (ESP32-S3 + 2,8"-Touch-Display ILI9341/XPT2046)
#
# 6 Relais schalten die 3 Heizelemente der Patrone im Stern (gegen N, ~1 kW)
# oder im Dreieck (gegen die Nachbarphase, ~3 kW). Daraus ergeben sich die
# Leistungsstufen 0 / 1 / 2 / 3 / 4 / 5 / 6 / 7 / 9 kW (siehe Tabelle unten).
#
# Betriebsarten (Entität "Betriebsart"):
#   Automatik: Stufe nach PV-Überschuss, mit Ein- und Ausschalthysterese
#              sowie Ein- und Ausschaltverzögerung
#   Hand:      Leistung über die Entität "Handleistung"
#
# In beiden Betriebsarten: Überschreitet der Max-Fühler die Maximaltemperatur,
# werden alle Relais abgeschaltet. Wieder eingeschaltet wird erst, wenn die
# Temperatur um die Temperatur-Hysterese gefallen ist.
#
# Touch-Bedienung am Display: Betriebsart umschalten, Handleistung -/+,
# Einstellungsseite (Temperatur, Hysteresen, Verzögerungen).
#
# SICHERHEIT: Diese Abschaltung ersetzt NICHT den Sicherheitstemperatur-
# begrenzer (STB) bzw. Thermostat der Heizpatrone!
# =============================================================================

substitutions:
  name: heizpatrone
  friendly_name: "Heizpatrone"

  # Home-Assistant-Sensor mit dem PV-Überschuss in Watt.
  # Positiv = Einspeisung ins Netz (siehe Hinweis beim Sensor weiter unten).
  pv_sensor: sensor.pv_ueberschuss

  # ---------------------------------------------------------------------------
  # Leistungsstufen laut Spezifikation
  #   Reihenfolge der Relais: K1 L1, K2 L2/N, K3 L2, K4 L3/N, K5 L3, K6 L1/N
  #   "1" = Relais ein. Die Optionen der Entität "Handleistung" (weiter unten)
  #   müssen in derselben Reihenfolge stehen.
  # ---------------------------------------------------------------------------
  stufen_leistung: "0, 1000, 2000, 3000, 4000, 5000, 6000, 7000, 9000"
  stufen_relais: '"000000", "100000", "101000", "101010", "111000", "111010", "111100", "111110", "111111"'

  # Pause beim Umschalten der /N-Relais (siehe Skript "relais_schalten")
  umschaltpause: 500ms

  # Startwerte der in Home Assistant einstellbaren Parameter
  max_temperatur: "80"
  temperatur_hysterese: "5"
  einschalthysterese: "100"
  ausschalthysterese: "100"
  einschaltverzoegerung: "60"
  ausschaltverzoegerung: "30"
  # Display-Beleuchtung aus nach x Minuten ohne Berührung (0 = immer an)
  display_timeout: "10"

  # Flash-Größe des ESP32-S3-Moduls (N16R8 = 16MB; ältere N8/N8R2/N8R8 = 8MB)
  flash_groesse: 16MB

  # GPIOs (ESP32-S3-DevKitC-1) – siehe Schaltungsvorschlag.
  # Nicht verwenden: GPIO0/3/45/46 (Boot), 19/20 (USB), 26–37 (Flash/PSRAM),
  # 38/48 (RGB-LED), 43/44 (UART0).
  pin_k1_l1: GPIO4
  pin_k2_l2n: GPIO5
  pin_k3_l2: GPIO6
  pin_k4_l3n: GPIO7
  pin_k5_l3: GPIO15
  pin_k6_l1n: GPIO16
  pin_onewire_max: GPIO17
  pin_onewire_speicher: GPIO18
  # SPI gemeinsam für Display und Touch.
  # MISO nur an T_DO des Touch anschließen, SDO des Displays frei lassen.
  pin_spi_clk: GPIO12
  pin_spi_mosi: GPIO11
  pin_spi_miso: GPIO13
  pin_display_cs: GPIO10
  pin_display_dc: GPIO9
  pin_display_reset: GPIO14
  pin_display_led: GPIO21
  pin_touch_cs: GPIO2
  pin_touch_irq: GPIO1

  # Touch-Kalibrierung (Rohwerte 0–4095), siehe README "Touch kalibrieren"
  touch_x_min: "300"
  touch_x_max: "3800"
  touch_y_min: "300"
  touch_y_max: "3800"
  touch_swap_xy: "true"
  touch_mirror_x: "false"
  touch_mirror_y: "false"

  # Layout der Touch-Knöpfe (x, y, Breite, Höhe) – gilt für Anzeige UND
  # Touch-Auswertung. Normalerweise nicht ändern.
  knopf_modus: "4, 202, 152, 36"
  knopf_menue: "164, 202, 152, 36"
  knopf_hand_minus: "8, 160, 52, 36"
  knopf_hand_plus: "138, 160, 52, 36"
  knopf_zurueck: "4, 202, 312, 36"
  # Einstellungsseite: erste Zeile y, Zeilenhöhe, Minus-x, Plus-x, Knopfbreite
  einstellungen_layout: "28, 28, 212, 266, 48"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: ${flash_groesse}

# PSRAM des N16R8 (octal) – für einen flimmerfreien Display-Puffer.
# N8R2: mode: quad. Board ohne PSRAM (N8): diesen Block löschen.
psram:
  mode: octal
  speed: 80MHz

logger:

api:
  id: api_server
  encryption:
    key: !secret api_encryption

# OTA-Updates verschlüsselt mit demselben Schlüssel wie die API
ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_ap_password

captive_portal:

# -----------------------------------------------------------------------------
# Interne Zustände
# -----------------------------------------------------------------------------
globals:
  # Stufe, die die Logik geschaltet haben will (-1 = noch nie gesetzt)
  - id: ziel_stufe
    type: int
    initial_value: "-1"
  # Stufe, die das Schaltskript gerade umsetzt bzw. zuletzt umgesetzt hat
  - id: schalt_stufe
    type: int
    initial_value: "0"
  - id: ist_stufe
    type: int
    initial_value: "0"
  # Tatsächlich geschaltete Leistung in W (0 während einer N-Umschaltung)
  - id: ist_leistung
    type: float
    initial_value: "0"
  # Stufe der PV-Automatik
  - id: auto_stufe
    type: int
    initial_value: "0"
  # Anstehende Änderung der Automatik: +1 zuschalten, -1 abschalten, 0 keine
  - id: wunsch_richtung
    type: int
    initial_value: "0"
  - id: wunsch_stufe
    type: int
    initial_value: "0"
  - id: wunsch_seit
    type: uint32_t
    initial_value: "0"
  # PV-Überschuss + aktuell geschaltete Heizleistung
  - id: verfuegbare_leistung
    type: float
    initial_value: "NAN"
  # Abschaltung wegen Übertemperatur / fehlendem Messwert am Max-Fühler
  - id: uebertemp
    type: bool
    initial_value: "true"
  - id: status_str
    type: std::string
    initial_value: '""'
  # Display-Seite: 0 = Übersicht, 1 = Einstellungen
  - id: seite
    type: int
    initial_value: "0"
  # Zeitpunkt der letzten Berührung bzw. des letzten Einschaltens (millis)
  - id: letzte_beruehrung
    type: uint32_t
    initial_value: "0"
  # Zuletzt gedrückter Knopf (für kurzes Hervorheben)
  - id: gedrueckt
    type: int
    initial_value: "-1"
  - id: gedrueckt_zeit
    type: uint32_t
    initial_value: "0"

# -----------------------------------------------------------------------------
# Temperaturfühler DS18B20 (je Bus ein 4,7-kΩ-Pull-up nach 3,3 V!)
# -----------------------------------------------------------------------------
one_wire:
  # Eingang 1: genau ein Fühler für die Maximaltemperatur
  - platform: gpio
    id: bus_max
    pin: ${pin_onewire_max}
  # Eingang 2: 1–5 Fühler für den Temperaturverlauf im Speicher
  - platform: gpio
    id: bus_speicher
    pin: ${pin_onewire_speicher}

sensor:
  - platform: dallas_temp
    id: temp_max
    one_wire_id: bus_max
    name: "Temperatur Max-Fühler"
    update_interval: 5s

  # Speicherfühler: Zuerst per "index" (Reihenfolge nach Adresse, NICHT nach
  # Einbauhöhe). Nach dem ersten Start die Adressen aus dem Log ablesen und
  # "index: X" durch "address: 0x..." ersetzen, damit Speicher 1 oben sitzt.
  # Nicht vorhandene Fühler einfach löschen.
  - platform: dallas_temp
    id: t_speicher_1
    one_wire_id: bus_speicher
    index: 0
    name: "Speicher 1 (oben)"
    update_interval: 30s
  - platform: dallas_temp
    id: t_speicher_2
    one_wire_id: bus_speicher
    index: 1
    name: "Speicher 2"
    update_interval: 30s
  - platform: dallas_temp
    id: t_speicher_3
    one_wire_id: bus_speicher
    index: 2
    name: "Speicher 3"
    update_interval: 30s
  - platform: dallas_temp
    id: t_speicher_4
    one_wire_id: bus_speicher
    index: 3
    name: "Speicher 4"
    update_interval: 30s
  - platform: dallas_temp
    id: t_speicher_5
    one_wire_id: bus_speicher
    index: 4
    name: "Speicher 5 (unten)"
    update_interval: 30s

  # PV-Überschuss aus Home Assistant
  - platform: homeassistant
    id: pv_ueberschuss
    entity_id: ${pv_sensor}
    # Liefert dein Sensor Einspeisung als NEGATIVEN Wert, einkommentieren:
    # filters:
    #   - multiply: -1

  - platform: template
    id: heizleistung
    name: "Heizleistung"
    icon: mdi:water-boiler
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    name: "Verfügbare Leistung"
    icon: mdi:solar-power
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    lambda: "return id(verfuegbare_leistung);"
    update_interval: 10s

binary_sensor:
  - platform: template
    name: "Übertemperatur"
    device_class: heat
    lambda: "return id(uebertemp);"

  # Relaiszustände nur zur Anzeige. Die Relais selbst sind bewusst nicht
  # direkt schaltbar, damit die /N-Relais nie unter Last umschalten.
  - platform: template
    name: "Relais K1 L1"
    lambda: "return id(k1).state;"
  - platform: template
    name: "Relais K2 L2-N"
    lambda: "return id(k2).state;"
  - platform: template
    name: "Relais K3 L2"
    lambda: "return id(k3).state;"
  - platform: template
    name: "Relais K4 L3-N"
    lambda: "return id(k4).state;"
  - platform: template
    name: "Relais K5 L3"
    lambda: "return id(k5).state;"
  - platform: template
    name: "Relais K6 L1-N"
    lambda: "return id(k6).state;"

text_sensor:
  - platform: template
    id: status_text
    name: "Status"
    icon: mdi:information-outline
    update_interval: never

# -----------------------------------------------------------------------------
# Relais (über ULN2803A, GPIO high = Relais ein)
# -----------------------------------------------------------------------------
switch:
  - platform: gpio
    id: k1
    pin: ${pin_k1_l1}
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: k2
    pin: ${pin_k2_l2n}
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: k3
    pin: ${pin_k3_l2}
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: k4
    pin: ${pin_k4_l3n}
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: k5
    pin: ${pin_k5_l3}
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: k6
    pin: ${pin_k6_l1n}
    internal: true
    restore_mode: ALWAYS_OFF

# -----------------------------------------------------------------------------
# Bedienung in Home Assistant
# -----------------------------------------------------------------------------
select:
  - platform: template
    id: betriebsart
    name: "Betriebsart"
    icon: mdi:hand-back-right-outline
    options:
      - "Automatik"
      - "Hand"
    initial_option: "Automatik"
    optimistic: true
    restore_value: true

  # Reihenfolge muss zu "stufen_leistung" passen
  - platform: template
    id: handleistung
    name: "Handleistung"
    icon: mdi:lightning-bolt
    options:
      - "0 W"
      - "1000 W"
      - "2000 W"
      - "3000 W"
      - "4000 W"
      - "5000 W"
      - "6000 W"
      - "7000 W"
      - "9000 W"
    initial_option: "0 W"
    optimistic: true
    restore_value: true

number:
  - platform: template
    id: max_temperatur
    name: "Maximaltemperatur"
    icon: mdi:thermometer-alert
    entity_category: config
    unit_of_measurement: "°C"
    min_value: 20
    max_value: 95
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${max_temperatur}

  - platform: template
    id: temp_hysterese
    name: "Temperatur-Hysterese"
    icon: mdi:thermometer-minus
    entity_category: config
    unit_of_measurement: "K"
    min_value: 1
    max_value: 20
    step: 0.5
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${temperatur_hysterese}

  - platform: template
    id: ein_hysterese
    name: "Einschalthysterese"
    icon: mdi:arrow-up-bold-outline
    entity_category: config
    unit_of_measurement: W
    min_value: 0
    max_value: 2000
    step: 50
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${einschalthysterese}

  - platform: template
    id: aus_hysterese
    name: "Ausschalthysterese"
    icon: mdi:arrow-down-bold-outline
    entity_category: config
    unit_of_measurement: W
    min_value: 0
    max_value: 2000
    step: 50
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${ausschalthysterese}

  - platform: template
    id: ein_verzoegerung
    name: "Einschaltverzögerung"
    icon: mdi:timer-plus-outline
    entity_category: config
    unit_of_measurement: s
    # Mindestens 10 s, damit der Messwert nach dem Schalten nachziehen kann
    min_value: 10
    max_value: 900
    step: 5
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${einschaltverzoegerung}

  - platform: template
    id: aus_verzoegerung
    name: "Ausschaltverzögerung"
    icon: mdi:timer-minus-outline
    entity_category: config
    unit_of_measurement: s
    min_value: 10
    max_value: 900
    step: 5
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${ausschaltverzoegerung}

  - platform: template
    id: display_timeout
    name: "Display-Timeout"
    icon: mdi:monitor-off
    entity_category: config
    unit_of_measurement: min
    min_value: 0
    max_value: 120
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${display_timeout}

# -----------------------------------------------------------------------------
# Display-Beleuchtung (LED-Pin des Displaymoduls, PWM-dimmbar)
# -----------------------------------------------------------------------------
output:
  - platform: ledc
    id: display_led_pwm
    pin: ${pin_display_led}

light:
  - platform: monochromatic
    id: hintergrund
    name: "Display-Beleuchtung"
    icon: mdi:brightness-6
    output: display_led_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 300ms
    # Auch beim Einschalten aus Home Assistant läuft der Timeout neu an
    on_turn_on:
      - lambda: "id(letzte_beruehrung) = millis();"

# -----------------------------------------------------------------------------
# Relais schalten
#
# Die /N-Relais (K2, K4, K6) schalten ein Elementende zwischen N und einer
# Phase um. Unter Last könnte der Lichtbogen dabei Phase und N kurzschließen.
# Deshalb: Ändert sich ein /N-Relais, zuerst alle Phasenrelais (K1, K3, K5)
# aus, Pause, /N-Relais umschalten, Pause, dann Phasenrelais einschalten.
# -----------------------------------------------------------------------------
script:
  - id: relais_schalten
    mode: queued
    max_runs: 5
    then:
      - lambda: |-
          id(schalt_stufe) = id(ziel_stufe);
      - if:
          condition:
            lambda: |-
              static const char *const MUSTER[] = {${stufen_relais}};
              const char *m = MUSTER[id(schalt_stufe)];
              return (m[1] == '1') != id(k2).state ||
                     (m[3] == '1') != id(k4).state ||
                     (m[5] == '1') != id(k6).state;
          then:
            - lambda: |-
                ESP_LOGI("heiz", "N-Umschaltung: Phasenrelais aus");
                id(ist_leistung) = 0;
            - switch.turn_off: k1
            - switch.turn_off: k3
            - switch.turn_off: k5
            - delay: ${umschaltpause}
            - lambda: |-
                static const char *const MUSTER[] = {${stufen_relais}};
                const char *m = MUSTER[id(schalt_stufe)];
                if (m[1] == '1') id(k2).turn_on(); else id(k2).turn_off();
                if (m[3] == '1') id(k4).turn_on(); else id(k4).turn_off();
                if (m[5] == '1') id(k6).turn_on(); else id(k6).turn_off();
            - delay: ${umschaltpause}
      - lambda: |-
          static const int LEISTUNG[] = {${stufen_leistung}};
          static const char *const MUSTER[] = {${stufen_relais}};
          const int s = id(schalt_stufe);
          const char *m = MUSTER[s];
          if (m[0] == '1') id(k1).turn_on(); else id(k1).turn_off();
          if (m[2] == '1') id(k3).turn_on(); else id(k3).turn_off();
          if (m[4] == '1') id(k5).turn_on(); else id(k5).turn_off();
          id(ist_stufe) = s;
          id(ist_leistung) = LEISTUNG[s];
          id(heizleistung).publish_state(LEISTUNG[s]);
          ESP_LOGI("heiz", "Heizleistung %d W (Relais %s)", LEISTUNG[s], m);

  # Auswertung einer Berührung (x, y in Display-Koordinaten 320 x 240)
  - id: beruehrung
    parameters:
      x: int
      y: int
    then:
      - lambda: |-
          const uint32_t jetzt = millis();
          if (jetzt - id(letzte_beruehrung) < 300) return;  // entprellen
          id(letzte_beruehrung) = jetzt;

          // Beleuchtung aus: erste Berührung weckt nur auf
          if (!id(hintergrund).remote_values.is_on()) {
            id(hintergrund).turn_on().perform();
            return;
          }

          static const int MODUS[4] = {${knopf_modus}};
          static const int MENUE[4] = {${knopf_menue}};
          static const int HMINUS[4] = {${knopf_hand_minus}};
          static const int HPLUS[4] = {${knopf_hand_plus}};
          static const int ZURUECK[4] = {${knopf_zurueck}};
          static const int EL[5] = {${einstellungen_layout}};
          // Trefferfläche etwas größer als der Knopf (resistiver Touch)
          auto in = [&](const int r[4]) {
            return x >= r[0] - 4 && x < r[0] + r[2] + 4 && y >= r[1] - 4 && y < r[1] + r[3] + 4;
          };

          int knopf = -1;
          if (id(seite) == 0) {
            const bool hand = id(betriebsart).active_index().value_or(0) == 1;
            if (in(MODUS)) {
              knopf = 1;
              id(betriebsart).make_call().set_option(hand ? "Automatik" : "Hand").perform();
            } else if (in(MENUE)) {
              knopf = 2;
              id(seite) = 1;
            } else if (hand && in(HMINUS)) {
              knopf = 3;
              id(handleistung).make_call().select_previous(false).perform();
            } else if (hand && in(HPLUS)) {
              knopf = 4;
              id(handleistung).make_call().select_next(false).perform();
            }
          } else {
            number::Number *const WERTE[6] = {
                id(max_temperatur), id(temp_hysterese), id(ein_hysterese),
                id(aus_hysterese), id(ein_verzoegerung), id(aus_verzoegerung)};
            if (in(ZURUECK)) {
              knopf = 5;
              id(seite) = 0;
            } else if (y >= EL[0] && y < EL[0] + 6 * EL[1] && x >= EL[2] - 6) {
              const int zeile = (y - EL[0]) / EL[1];
              const bool plus = x >= (EL[2] + EL[4] + EL[3]) / 2;
              auto call = WERTE[zeile]->make_call();
              if (plus) call.number_increment(false); else call.number_decrement(false);
              call.perform();
              knopf = 10 + zeile * 2 + (plus ? 1 : 0);
            }
          }
          if (knopf >= 0) {
            ESP_LOGD("touch", "Knopf %d (x=%d, y=%d)", knopf, x, y);
            id(gedrueckt) = knopf;
            id(gedrueckt_zeit) = jetzt;
            id(anzeige).update();
          }

# -----------------------------------------------------------------------------
# Regelung (jede Sekunde)
# -----------------------------------------------------------------------------
interval:
  - interval: 1s
    then:
      - lambda: |-
          static const int LEISTUNG[] = {${stufen_leistung}};
          static const int ANZAHL = sizeof(LEISTUNG) / sizeof(LEISTUNG[0]);
          const uint32_t jetzt = millis();

          // --- 1. Übertemperatur (gilt in jeder Betriebsart) ---------------
          const float t = id(temp_max).state;
          const float t_grenze = id(max_temperatur).state;
          bool ueber = id(uebertemp);
          if (std::isnan(t) || t > t_grenze) {
            ueber = true;  // auch ohne Messwert: sicherheitshalber aus
          } else if (t <= t_grenze - id(temp_hysterese).state) {
            ueber = false;
          }
          if (ueber != id(uebertemp)) {
            if (ueber) {
              ESP_LOGW("heiz", "Abschaltung: Max-Fühler %.1f °C (Grenze %.1f °C)", t, t_grenze);
            } else {
              ESP_LOGI("heiz", "Freigabe: Max-Fühler %.1f °C", t);
            }
            id(uebertemp) = ueber;
          }

          // --- 2. Verfügbare Leistung = PV-Überschuss + Heizleistung -------
          const float s = id(pv_ueberschuss).state;
          const bool pv_ok = id(api_server).is_connected() && !std::isnan(s);
          const float verfuegbar = pv_ok ? s + id(ist_leistung) : NAN;
          id(verfuegbare_leistung) = verfuegbar;

          // --- 3. Zielstufe ------------------------------------------------
          const bool hand = id(betriebsart).active_index().value_or(0) == 1;
          int ziel;
          if (hand) {
            ziel = id(handleistung).active_index().value_or(0);
            // Beim Wechsel auf Automatik mit der aktuellen Stufe weitermachen
            id(auto_stufe) = id(ist_stufe);
            id(wunsch_richtung) = 0;
          } else if (ueber) {
            id(auto_stufe) = 0;
            id(wunsch_richtung) = 0;
            ziel = 0;
          } else {
            const int n = id(auto_stufe);
            int z = n;
            if (!pv_ok) {
              z = 0;  // keine PV-Daten: (nach Ausschaltverzögerung) aus
            } else {
              // Abschalten: unter Stufenleistung minus Ausschalthysterese
              while (z > 0 && verfuegbar < LEISTUNG[z] - id(aus_hysterese).state) z--;
              // Zuschalten: höchste Stufe mit Leistung plus Einschalthysterese
              if (z == n) {
                for (int k = ANZAHL - 1; k > n; k--) {
                  if (verfuegbar >= LEISTUNG[k] + id(ein_hysterese).state) {
                    z = k;
                    break;
                  }
                }
              }
            }
            const int richtung = (z > n) - (z < n);
            if (richtung == 0) {
              id(wunsch_richtung) = 0;
            } else {
              id(wunsch_stufe) = z;
              if (richtung != id(wunsch_richtung)) {
                // Neue Anforderung: Verzögerung starten
                id(wunsch_richtung) = richtung;
                id(wunsch_seit) = jetzt;
              } else {
                const float verz = richtung > 0 ? id(ein_verzoegerung).state
                                                : id(aus_verzoegerung).state;
                if (jetzt - id(wunsch_seit) >= (uint32_t) (verz * 1000.0f)) {
                  ESP_LOGI("heiz", "Automatik: %d W -> %d W (verfügbar %.0f W)",
                           LEISTUNG[n], LEISTUNG[z], verfuegbar);
                  id(auto_stufe) = z;
                  id(wunsch_richtung) = 0;
                }
              }
            }
            ziel = id(auto_stufe);
          }
          if (ueber) ziel = 0;

          // --- 4. Schalten -------------------------------------------------
          if (ziel != id(ziel_stufe) ||
              (!id(relais_schalten).is_running() && ziel != id(ist_stufe))) {
            id(ziel_stufe) = ziel;
            id(relais_schalten).execute();
          }

          // --- 5. Status -----------------------------------------------------
          char buf[64];
          if (std::isnan(t)) {
            snprintf(buf, sizeof(buf), "Aus: Max-Fühler ohne Messwert");
          } else if (ueber) {
            snprintf(buf, sizeof(buf), "Übertemperatur %.1f °C", t);
          } else if (hand) {
            snprintf(buf, sizeof(buf), "Hand: %d W", LEISTUNG[ziel]);
          } else if (!pv_ok) {
            snprintf(buf, sizeof(buf), "Automatik: keine PV-Daten");
          } else if (id(wunsch_richtung) > 0) {
            snprintf(buf, sizeof(buf), "Automatik: Zuschalten angefordert");
          } else if (id(wunsch_richtung) < 0) {
            snprintf(buf, sizeof(buf), "Automatik: Abschalten angefordert");
          } else {
            snprintf(buf, sizeof(buf), "Automatik: %d W", LEISTUNG[ziel]);
          }
          if (id(status_str) != buf) {
            id(status_str) = buf;
            id(status_text).publish_state(buf);
          }

  # Display: zurück zur Übersicht und Beleuchtung aus, wenn niemand bedient
  - interval: 1s
    then:
      - lambda: |-
          const uint32_t ruhe = millis() - id(letzte_beruehrung);
          if (id(seite) != 0 && ruhe > 60000) {
            id(seite) = 0;
          }
          const bool an = id(hintergrund).remote_values.is_on();
          if (id(uebertemp)) {
            // Alarm: Beleuchtung bleibt an
            if (!an) id(hintergrund).turn_on().perform();
          } else if (an && id(display_timeout).state > 0 &&
                     ruhe > (uint32_t) (id(display_timeout).state * 60000.0f)) {
            id(hintergrund).turn_off().perform();
          }

# -----------------------------------------------------------------------------
# Display: ILI9341 2,8" 320x240 (SPI) mit zwei Seiten und Touch-Knöpfen
# -----------------------------------------------------------------------------
spi:
  clk_pin: ${pin_spi_clk}
  mosi_pin: ${pin_spi_mosi}
  miso_pin: ${pin_spi_miso}

font:
  - file: "gfonts://Roboto"
    id: font_xs
    size: 12
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: "gfonts://Roboto"
    id: font_s
    size: 15
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: font_m
    size: 17
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: font_l
    size: 40
    glyphs: "0123456789 -.W"

display:
  - platform: mipi_spi
    id: anzeige
    model: ILI9341
    cs_pin: ${pin_display_cs}
    dc_pin: ${pin_display_dc}
    reset_pin: ${pin_display_reset}
    rotation: 90
    update_interval: 1s
    lambda: |-
      static const int LEISTUNG[] = {${stufen_leistung}};
      static const char *const NAMEN[6] = {"L1", "L2/N", "L2", "L3/N", "L3", "L1/N"};
      static const int MODUS[4] = {${knopf_modus}};
      static const int MENUE[4] = {${knopf_menue}};
      static const int HMINUS[4] = {${knopf_hand_minus}};
      static const int HPLUS[4] = {${knopf_hand_plus}};
      static const int ZURUECK[4] = {${knopf_zurueck}};
      static const int EL[5] = {${einstellungen_layout}};
      const Color WEISS(255, 255, 255), HELL(190, 190, 190), GRAU(110, 110, 110),
                  DUNKEL(45, 45, 45), ROT(230, 40, 40), BLAU(40, 100, 235),
                  GRUEN(40, 150, 75), ORANGE(220, 125, 10), SCHWARZ(0, 0, 0);
      // Temperatur -> Farbe (20 °C blau ... 80 °C rot)
      auto farbe = [](float t) -> Color {
        float f = (t - 20.0f) / 60.0f;
        f = f < 0 ? 0 : (f > 1 ? 1 : f);
        return Color(40 + f * 200, 70 - f * 30, 235 - f * 195);
      };
      // Knopf zeichnen; kurz nach dem Drücken hell hervorgehoben
      const uint32_t jetzt = millis();
      auto ist_gedrueckt = [&](int knopf) {
        return id(gedrueckt) == knopf && jetzt - id(gedrueckt_zeit) < 400;
      };
      auto knopf = [&](const int r[4], Color fuell, bool gedr) -> Color {
        it.filled_rectangle(r[0], r[1], r[2], r[3], gedr ? HELL : fuell);
        it.rectangle(r[0], r[1], r[2], r[3], GRAU);
        return gedr ? SCHWARZ : WEISS;  // Textfarbe
      };
      auto minus_plus = [&](int cx, int cy, bool plus, Color c) {
        it.filled_rectangle(cx - 9, cy - 2, 18, 4, c);
        if (plus) it.filled_rectangle(cx - 2, cy - 9, 4, 18, c);
      };
      const bool hand = id(betriebsart).active_index().value_or(0) == 1;
      const bool ueber = id(uebertemp);

      it.fill(SCHWARZ);

      // Statuszeile oben (rot bei Übertemperatur)
      it.filled_rectangle(0, 0, 320, 24, ueber ? ROT : DUNKEL);
      if (id(seite) == 1 && !ueber) {
        it.print(160, 12, id(font_m), WEISS, TextAlign::CENTER, "Einstellungen");
      } else {
        it.print(160, 12, id(font_s), WEISS, TextAlign::CENTER, id(status_str).c_str());
      }

      if (id(seite) == 1) {
        // ---------------- Seite 2: Einstellungen ----------------
        static const char *const TEXT[6] = {"Max.-Temperatur", "Temp.-Hysterese",
                                            "Einschalthyst.", "Ausschalthyst.",
                                            "Einschaltverz.", "Ausschaltverz."};
        static const char *const FORMAT[6] = {"%.0f °C", "%.1f K", "%.0f W",
                                              "%.0f W", "%.0f s", "%.0f s"};
        const float wert[6] = {id(max_temperatur).state, id(temp_hysterese).state,
                               id(ein_hysterese).state, id(aus_hysterese).state,
                               id(ein_verzoegerung).state, id(aus_verzoegerung).state};
        for (int i = 0; i < 6; i++) {
          const int y = EL[0] + i * EL[1];
          it.print(8, y + EL[1] / 2, id(font_s), HELL, TextAlign::CENTER_LEFT, TEXT[i]);
          it.printf(202, y + EL[1] / 2, id(font_m), WEISS, TextAlign::CENTER_RIGHT,
                    FORMAT[i], wert[i]);
          const int rm[4] = {EL[2], y + 2, EL[4], EL[1] - 4};
          const int rp[4] = {EL[3], y + 2, EL[4], EL[1] - 4};
          Color c = knopf(rm, DUNKEL, ist_gedrueckt(10 + i * 2));
          minus_plus(rm[0] + rm[2] / 2, rm[1] + rm[3] / 2, false, c);
          c = knopf(rp, DUNKEL, ist_gedrueckt(11 + i * 2));
          minus_plus(rp[0] + rp[2] / 2, rp[1] + rp[3] / 2, true, c);
        }
        const Color c = knopf(ZURUECK, DUNKEL, ist_gedrueckt(5));
        it.print(ZURUECK[0] + ZURUECK[2] / 2, ZURUECK[1] + ZURUECK[3] / 2, id(font_m), c,
                 TextAlign::CENTER, "Zurück zur Übersicht");
        return;
      }

      // ---------------- Seite 1: Übersicht ----------------
      // Heizleistung mit Balken (0 ... 9 kW)
      it.print(8, 28, id(font_s), HELL, TextAlign::TOP_LEFT, "Heizleistung");
      it.printf(8, 42, id(font_l), WEISS, TextAlign::TOP_LEFT, "%.0f W", id(ist_leistung));
      const int max_w = LEISTUNG[sizeof(LEISTUNG) / sizeof(LEISTUNG[0]) - 1];
      it.rectangle(8, 88, 182, 10, GRAU);
      it.filled_rectangle(9, 89, (int) (id(ist_leistung) / max_w * 180), 8, ueber ? ROT : ORANGE);

      // Relais: rot = ein; /N-Relais blau = aus (Stellung N)
      const bool rel[6] = {id(k1).state, id(k2).state, id(k3).state,
                           id(k4).state, id(k5).state, id(k6).state};
      for (int i = 0; i < 6; i++) {
        const int x = 22 + i * 31;
        const bool n_relais = (i % 2) == 1;
        it.filled_circle(x, 114, 8, rel[i] ? ROT : (n_relais ? BLAU : DUNKEL));
        it.circle(x, 114, 8, GRAU);
        it.print(x, 125, id(font_xs), HELL, TextAlign::TOP_CENTER, NAMEN[i]);
      }

      if (hand) {
        // Handleistung mit - / + Knöpfen
        it.print(8, 142, id(font_s), HELL, TextAlign::TOP_LEFT, "Handleistung");
        const int h = id(handleistung).active_index().value_or(0);
        it.printf(99, HMINUS[1] + HMINUS[3] / 2, id(font_m), WEISS, TextAlign::CENTER,
                  "%d W", LEISTUNG[h]);
        Color c = knopf(HMINUS, DUNKEL, ist_gedrueckt(3));
        minus_plus(HMINUS[0] + HMINUS[2] / 2, HMINUS[1] + HMINUS[3] / 2, false, c);
        c = knopf(HPLUS, DUNKEL, ist_gedrueckt(4));
        minus_plus(HPLUS[0] + HPLUS[2] / 2, HPLUS[1] + HPLUS[3] / 2, true, c);
      } else {
        // PV
        const float s = id(pv_ueberschuss).state;
        it.print(8, 142, id(font_s), HELL, TextAlign::TOP_LEFT, "PV-Überschuss");
        if (std::isnan(s)) {
          it.print(190, 142, id(font_s), GRAU, TextAlign::TOP_RIGHT, "--");
        } else {
          it.printf(190, 142, id(font_s), WEISS, TextAlign::TOP_RIGHT, "%.0f W", s);
        }
        it.print(8, 160, id(font_s), HELL, TextAlign::TOP_LEFT, "Verfügbar");
        if (std::isnan(id(verfuegbare_leistung))) {
          it.print(190, 160, id(font_s), GRAU, TextAlign::TOP_RIGHT, "--");
        } else {
          it.printf(190, 160, id(font_s), WEISS, TextAlign::TOP_RIGHT, "%.0f W",
                    id(verfuegbare_leistung));
        }
        // Countdown der Automatik
        if (!ueber && id(wunsch_richtung) != 0) {
          const float verz = id(wunsch_richtung) > 0 ? id(ein_verzoegerung).state
                                                     : id(aus_verzoegerung).state;
          int rest = (int) (verz - (jetzt - id(wunsch_seit)) / 1000.0f);
          if (rest < 0) rest = 0;
          it.printf(8, 178, id(font_s), ORANGE, TextAlign::TOP_LEFT, "%s %d W in %d s",
                    id(wunsch_richtung) > 0 ? "Auf" : "Ab", LEISTUNG[id(wunsch_stufe)], rest);
        }
      }

      // Speicher: 5 Schichten von oben nach unten
      const float sp[5] = {id(t_speicher_1).state, id(t_speicher_2).state,
                           id(t_speicher_3).state, id(t_speicher_4).state,
                           id(t_speicher_5).state};
      it.print(260, 28, id(font_s), HELL, TextAlign::TOP_CENTER, "Speicher");
      for (int i = 0; i < 5; i++) {
        const int y = 46 + i * 24;
        if (std::isnan(sp[i])) {
          it.filled_rectangle(206, y, 108, 24, DUNKEL);
          it.printf(260, y + 12, id(font_s), GRAU, TextAlign::CENTER, "S%d --", i + 1);
        } else {
          it.filled_rectangle(206, y, 108, 24, farbe(sp[i]));
          it.printf(260, y + 12, id(font_s), WEISS, TextAlign::CENTER, "%.1f °C", sp[i]);
        }
      }
      it.rectangle(205, 45, 110, 122, GRAU);

      // Max-Fühler
      const float t = id(temp_max).state;
      if (std::isnan(t)) {
        it.print(260, 169, id(font_s), ROT, TextAlign::TOP_CENTER, "Max --");
      } else {
        it.printf(260, 169, id(font_s), ueber ? ROT : WEISS, TextAlign::TOP_CENTER,
                  "Max %.1f °C", t);
      }
      it.printf(260, 186, id(font_xs), HELL, TextAlign::TOP_CENTER, "Grenze %.0f °C",
                id(max_temperatur).state);

      // Knöpfe unten
      Color c = knopf(MODUS, hand ? ORANGE : GRUEN, ist_gedrueckt(1));
      it.print(MODUS[0] + MODUS[2] / 2, MODUS[1] + MODUS[3] / 2, id(font_m), c,
               TextAlign::CENTER, hand ? "Modus: Hand" : "Modus: Automatik");
      c = knopf(MENUE, DUNKEL, ist_gedrueckt(2));
      it.print(MENUE[0] + MENUE[2] / 2, MENUE[1] + MENUE[3] / 2, id(font_m), c,
               TextAlign::CENTER, "Einstellungen");

# -----------------------------------------------------------------------------
# Touch: XPT2046 (resistiv) am selben SPI-Bus wie das Display
# -----------------------------------------------------------------------------
touchscreen:
  - platform: xpt2046
    id: touch
    display: anzeige
    cs_pin: ${pin_touch_cs}
    interrupt_pin:
      number: ${pin_touch_irq}
      mode:
        input: true
        pullup: true
    threshold: 400
    calibration:
      x_min: ${touch_x_min}
      x_max: ${touch_x_max}
      y_min: ${touch_y_min}
      y_max: ${touch_y_max}
    transform:
      swap_xy: ${touch_swap_xy}
      mirror_x: ${touch_mirror_x}
      mirror_y: ${touch_mirror_y}
    on_touch:
      - lambda: |-
          // Für die Kalibrierung: Rohwerte im Log
          ESP_LOGI("touch", "x=%d y=%d (roh x=%d y=%d)", touch.x, touch.y, touch.x_raw, touch.y_raw);
      - script.execute:
          id: beruehrung
          x: !lambda "return touch.x;"
          y: !lambda "return touch.y;"
